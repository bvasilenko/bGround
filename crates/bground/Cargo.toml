[package]
name = "bground"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Prompt lookup tool. Agent names a claim type from a fixed list of 16; bground returns the prompt for that claim type. The prompt tells the agent how to check the claim against supplied evidence."

[lib]
name = "bground"
path = "src/lib.rs"

[[bin]]
name = "bground"
path = "src/main.rs"

[dependencies]
bsuite-core = { git = "https://github.com/bvasilenko/bsuite-core", branch = "main" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror.workspace = true

[dev-dependencies]
assert_cmd = "2"
proptest = "1"
