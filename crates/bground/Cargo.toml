[package]
name = "bground"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Prompt lookup tool. Agent names a claim type from a fixed list; bground returns the prompt for that claim type. The prompt tells the agent how to check the claim against supplied evidence."

[lib]
name = "bground"
path = "src/lib.rs"

[[bin]]
name = "bground"
path = "src/main.rs"

[[bin]]
name = "gen-fixture"
path = "src/bin/gen_fixture.rs"

[dependencies]
bsuite-core = { git = "https://github.com/bvasilenko/bCore", tag = "v0.2.0" }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
toml = "0.8"
ulid = "1"

[dev-dependencies]
assert_cmd = "2"
httpmock = "0.7"
proptest = "1"
tempfile = "3"
